name: Commit messages

# Every pull request title and commit must follow Conventional Commits (see CONTRIBUTING.md).
# The check runs the same .githooks/commit-msg hook that contributors run locally.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  lint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          file=$(mktemp)
          printf '%s\n' "$PR_TITLE" > "$file"
          sh .githooks/commit-msg "$file"

      - name: Check commits in the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            file=$(mktemp)
            git log -1 --format=%B "$sha" > "$file"
            if ! sh .githooks/commit-msg "$file"; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$sha") does not follow Conventional Commits."
              failed=1
            fi
          done
          exit $failed
