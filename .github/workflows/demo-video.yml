name: Demo video
on:
  push:
    branches: [demo-video]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo hello > probe.txt; pip install edge-tts >/dev/null && edge-tts --list-voices | grep vi-VN
      - uses: actions/upload-artifact@v4
        with: { name: probe, path: probe.txt, retention-days: 1 }
