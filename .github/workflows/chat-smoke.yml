name: Chat smoke test

# Manual check of the live AI characters: asks a few questions to production and prints the replies.
# Each run spends a few AI answers from the daily budget, so it never runs on its own.
on:
  workflow_dispatch:
    inputs:
      questions:
        description: "One question per line as character-id|question (empty = default set)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the live characters
        env:
          SITE: https://xuyen-su-ky.vercel.app
          QUESTIONS: ${{ inputs.questions }}
        run: |
          node --input-type=module <<'JS'
          const defaults = [
            'ngo-quyen|Chiến thắng Bạch Đằng diễn ra năm nào?',
            'tran-hung-dao|Ông đánh quân Nguyên thế nào?',
            'ho-chi-minh|Bác ra đi tìm đường cứu nước khi nào?',
            'hai-ba-trung|Vì sao hai bà khởi nghĩa?',
            'ly-cong-uan|Vì sao ông dời đô về Thăng Long?',
            'quang-trung|Ông là ai?',
          ]
          const lines = (process.env.QUESTIONS || '').split('\n').map((line) => line.trim()).filter(Boolean)
          let failed = 0
          for (const line of lines.length ? lines : defaults) {
            const [id, message] = line.split('|')
            const response = await fetch(`${process.env.SITE}/api/characters/${id}/chat`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message, history: [] }) })
            const body = await response.json().catch(() => ({}))
            if (!response.ok) failed++
            console.log(`\n=== ${id}: ${message}`)
            console.log(`HTTP ${response.status} · mode=${body.mode}${body.model ? ` · model=${body.model}` : ''} · kind=${body.kind} · sources=${body.sources?.length ?? 0}${body.fallback ? ` · fallback=${body.fallback}` : ''}${body.notice ? ` · notice: ${body.notice}` : ''}`)
            console.log(body.answer ?? JSON.stringify(body))
            for (const source of body.sources ?? []) console.log(`  - Lớp ${source.grade}: ${source.lessonTitle} (${source.source?.book}, tr. ${source.source?.pageStart})`)
          }
          // Voice: text-to-speech for "Nghe câu trả lời" and the live voice session. Prints status and error code only.
          const characters = await (await fetch(`${process.env.SITE}/api/characters`)).json().catch(() => ({}))
          console.log(`\n=== Voice · liveVoice on: ${(characters.items ?? []).filter((item) => item.liveVoice).map((item) => item.id).join(', ') || 'none'}`)
          for (const id of ['ngo-quyen', 'hai-ba-trung']) {
            const speech = await fetch(`${process.env.SITE}/api/characters/${id}/speech`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: 'Chào con.' }) })
            const speechBody = speech.headers.get('content-type')?.includes('audio') ? `${(await speech.arrayBuffer()).byteLength} bytes audio` : await speech.text()
            console.log(`speech ${id}: HTTP ${speech.status} · ${speechBody.slice(0, 300)}`)
            const session = await fetch(`${process.env.SITE}/api/characters/${id}/voice-session`, { method: 'POST' })
            const sessionBody = await session.json().catch(() => ({}))
            console.log(`voice-session ${id}: HTTP ${session.status} · ${sessionBody.signedUrl ? 'signed URL ok' : JSON.stringify(sessionBody).slice(0, 300)}`)
          }
          process.exit(failed ? 1 : 0)
          JS
